[project]
name = "interview-coach"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "s8abab", email = "shabab@intoaec.ai" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.146.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
interview-coach = "interview_coach:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
